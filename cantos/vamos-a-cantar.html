<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prueba de transposición</title>

    <script
        src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"
        defer>
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            background: white;
        }

        .controles {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button, select {
            padding: 10px 15px;
            font-size: 16px;
        }

        #partitura {
            overflow-x: auto;
            min-width: 700px;
        }

        #partitura svg {
            width: 100%;
            height: auto;
        }

        #estado {
            padding: 20px;
        }
    </style>
</head>

<body>

<main>

    <h1>Vamos a Cantar</h1>

    <div class="controles">

        <strong>Tonalidad:</strong>

        <button id="bajar">
            −½
        </button>

        <select id="tono">
            <option value="0">E♭</option>
            <option value="1">E</option>
            <option value="2">F</option>
            <option value="3">F♯</option>
            <option value="4">G</option>
            <option value="5">A♭</option>
            <option value="6">A</option>
            <option value="7">B♭</option>
            <option value="8">B</option>
            <option value="9">C</option>
            <option value="10">D♭</option>
            <option value="11">D</option>
        </select>

        <button id="subir">
            +½
        </button>

    </div>

    <div id="estado">
        Cargando...
    </div>

    <div id="partitura"></div>

</main>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        verovio.module.onRuntimeInitialized =
        async function () {

            const toolkit =
                new verovio.toolkit();

            const respuesta =
                await fetch(
                    "Vamos a Cantar Chart.mxl"
                );

            const datos =
                await respuesta.arrayBuffer();

            const selector =
                document.getElementById("tono");


            function cargarYTransponer() {

                /*
                IMPORTANTE:
                ponemos la transposición
                ANTES de volver a cargar
                el archivo.
                */

                const semitonos =
                    Number(selector.value);


                toolkit.setOptions({

                    transpose:
                        semitonos === 0
                        ? ""
                        : String(semitonos),

                    breaks: "encoded",

                    pageWidth: 2100,

                    pageHeight: 60000,

                    adjustPageHeight: true,

                    scale: 45,

                    header: "none",

                    footer: "none"

                });


                /*
                Volvemos a cargar siempre
                el archivo ORIGINAL.
                */

                const cargado =
                    toolkit.loadZipDataBuffer(
                        datos
                    );


                if (!cargado) {

                    document
                        .getElementById("estado")
                        .innerHTML =
                        "Error cargando el MXL.";

                    return;
                }


                document
                    .getElementById("estado")
                    .style.display =
                    "none";


                /*
                Renderizamos de nuevo.
                */

                const svg =
                    toolkit.renderToSVG(1);


                document
                    .getElementById("partitura")
                    .innerHTML =
                    svg;

            }


            /*
            Primera carga:
            tonalidad original Eb.
            */

            cargarYTransponer();


            document
                .getElementById("subir")
                .addEventListener(
                    "click",
                    function () {

                        let valor =
                            Number(
                                selector.value
                            );

                        valor =
                            (valor + 1) % 12;

                        selector.value =
                            valor;

                        cargarYTransponer();

                    }
                );


            document
                .getElementById("bajar")
                .addEventListener(
                    "click",
                    function () {

                        let valor =
                            Number(
                                selector.value
                            );

                        valor =
                            (valor + 11) % 12;

                        selector.value =
                            valor;

                        cargarYTransponer();

                    }
                );


            selector.addEventListener(
                "change",
                cargarYTransponer
            );

        };

    }
);

</script>

</body>
</html>
