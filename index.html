<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancionero de la Iglesia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-bottom: 0;
            opacity: 0.8;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .buscador {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .canto {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .canto h2 {
            margin-top: 0;
        }

        .acorde {
            color: #8b4513;
            font-weight: bold;
        }

        .letra {
            white-space: pre-line;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<header>
    <h1>🎵 Cancionero de la Iglesia</h1>
    <p>Letra y acordes de nuestros cantos</p>
</header>

<main>

    <input
        type="text"
        class="buscador"
        placeholder="🔎 Buscar un canto..."
    >

    <div class="canto">
        <h2>Ejemplo de canto</h2>

        <div class="letra">
<span class="acorde">G</span>              <span class="acorde">D</span>
Grande es tu fidelidad

<span class="acorde">Em</span>             <span class="acorde">C</span>
Grande es tu amor

        </div>
    </div>

</main>

</body>
</html>
