<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cancionero El Mesías</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 10px 0 0;
            opacity: 0.8;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .buscador {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .seccion {
            margin-bottom: 35px;
        }

        .seccion h2 {
            margin-bottom: 15px;
        }

        .cantos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
        }

        .canto {
            display: block;
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .canto:hover {
            transform: translateY(-3px);
        }

        .canto h3 {
            margin: 0 0 8px;
        }

        .canto p {
            margin: 0;
            color: #777;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎵 Cancionero El Mesías</h1>
    <p>Letra y acordes de nuestros cantos</p>
</header>

<main>

    <input
        type="text"
        id="buscador"
        class="buscador"
        placeholder="🔎 Buscar un canto..."
    >

    <section class="seccion">
        <h2>🎸 Alabanza</h2>

        <div class="cantos">

            <a href="#" class="canto">
                <h3>Grande es tu fidelidad</h3>
                <p>Alabanza</p>
            </a>

            <a href="#" class="canto">
                <h3>Canto de ejemplo</h3>
                <p>Alabanza</p>
            </a>

        </div>
    </section>

    <section class="seccion">
        <h2>🙏 Adoración</h2>

        <div class="cantos">

            <a href="#" class="canto">
                <h3>Canto de adoración</h3>
                <p>Adoración</p>
            </a>

        </div>
    </section>

</main>

<footer>
    Cancionero de la Iglesia El Mesías
</footer>

<script>

    const buscador = document.getElementById("buscador");
    const cantos = document.querySelectorAll(".canto");

    buscador.addEventListener("input", function() {

        const texto = buscador.value.toLowerCase();

        cantos.forEach(function(canto) {

            const nombre = canto.innerText.toLowerCase();

            if (nombre.includes(texto)) {
                canto.style.display = "block";
            } else {
                canto.style.display = "none";
            }

        });

    });

</script>

</body>
</html>
